name: Notifiche e copia veloce
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['dati/**']
permissions:
  contents: write
concurrency:
  group: notifiche
jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node invio/invia.js
        env:
          API_URL: ${{ secrets.API_URL }}
          NOT_SEGRETO: ${{ secrets.NOT_SEGRETO }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Salva la copia cifrata
        run: |
          git add dati/portale.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name="Coro La Cordata" -c user.email="info@corolacordata.org" commit -m "Copia cifrata aggiornata"
          git push
      - name: Pulizia della domenica (resta solo l'ultima versione)
        run: |
          [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "03" ] || exit 0
          # se intanto qualcuno ha pubblicato una versione nuova, non si tocca niente (la pulizia si rifà la domenica dopo)
          git fetch -q origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || exit 0
          # i programmi scaricati per mandare le notifiche non vanno sul sito
          rm -rf node_modules package.json package-lock.json
          git checkout --orphan pulito
          git add -A
          git -c user.name="Coro La Cordata" -c user.email="info@corolacordata.org" commit -q -m "Pulizia: resta solo l'ultima versione"
          git push -f origin pulito:main
