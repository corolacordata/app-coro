name: Notifiche e copia veloce
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['dati/**']
permissions:
  contents: write
concurrency:
  group: notifiche
jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node invio/invia.js
        env:
          API_URL: ${{ secrets.API_URL }}
          NOT_SEGRETO: ${{ secrets.NOT_SEGRETO }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Salva la copia cifrata
        run: |
          git add dati/portale.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name="Coro La Cordata" -c user.email="info@corolacordata.org" commit -m "Copia cifrata aggiornata"
          git push
