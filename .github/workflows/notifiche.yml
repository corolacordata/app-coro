name: Notifiche
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notifiche
jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node invio/invia.js
        env:
          API_URL: ${{ secrets.API_URL }}
          NOT_SEGRETO: ${{ secrets.NOT_SEGRETO }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
